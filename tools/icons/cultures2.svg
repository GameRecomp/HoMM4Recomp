<!-- Cultures 2's icon: a Viking's round shield with a II and a spear behind it, warm like the
     game's GOG icon; drawn for this project. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="sky" cx="0.42" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffcf6e"/>
      <stop offset="0.5" stop-color="#d9602a"/>
      <stop offset="1" stop-color="#5e1a10"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.5" stop-color="#b9bcc2"/>
      <stop offset="1" stop-color="#7d8189"/>
    </linearGradient>
    <radialGradient id="boss" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#5d636c"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="108"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#ring)"/>
  <circle cx="128" cy="128" r="110" fill="#5a5d63"/>
  <g clip-path="url(#disc)">
    <circle cx="128" cy="128" r="108" fill="url(#sky)"/>
    <!-- spear -->
    <path d="M52 220 L196 56" stroke="#4a2c14" stroke-width="10" stroke-linecap="round"/>
    <path d="M196 56 L214 30 L206 62 Z" fill="#cfd3d9" stroke="#3d4148" stroke-width="3" stroke-linejoin="round"/>
    <!-- shield: planks, rim, painted halves -->
    <circle cx="128" cy="144" r="72" fill="#8a5a2c" stroke="#3a2412" stroke-width="5"/>
    <path d="M128 72 A72 72 0 0 1 128 216 Z" fill="#b8322a"/>
    <path d="M128 72 A72 72 0 0 0 128 216 Z" fill="#e9dcc0"/>
    <g stroke="#3a2412" stroke-width="2" opacity="0.35">
      <path d="M80 92 V196 M104 76 V212 M152 76 V212 M176 92 V196"/>
    </g>
    <circle cx="128" cy="144" r="72" fill="none" stroke="#5d636c" stroke-width="7"/>
    <circle cx="128" cy="144" r="18" fill="url(#boss)" stroke="#33373d" stroke-width="3"/>
    <!-- II -->
    <g fill="#f6c443" stroke="#5a3a08" stroke-width="3" stroke-linejoin="round">
      <path d="M86 112 H118 V122 H108 V166 H118 V176 H86 V166 H96 V122 H86 Z"/>
      <path d="M138 112 H170 V122 H160 V166 H170 V176 H138 V166 H148 V122 H138 Z"/>
    </g>
  </g>
</svg>
